<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ─── Viewport ─── viewport-fit=cover enables safe-area-inset on iOS notch devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ─── PWA Manifest ─── injected by vite-plugin-pwa -->

    <!-- ─── Theme Colors ─── -->
    <meta name="theme-color" content="#ff3131" />

    <!-- ─── App Identity ─── -->
    <meta name="application-name" content="Amatyma" />
    <meta name="description" content="Connect and chat with your community on Amatyma" />

    <!-- ─── iOS PWA ─── -->
    <!-- Enables add-to-home-screen on Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent = status bar overlays app (fullscreen feel) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Amatyma" />

    <!-- Apple touch icons (Safari uses these, not the manifest) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ─── Android / Chrome ─── -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ─── Windows / Edge / Tiles ─── -->
    <meta name="msapplication-TileColor" content="#ff3131" />
    <meta name="msapplication-TileImage" content="/icon-144x144.png" />
    <meta name="msapplication-config" content="none" />

    <!-- ─── Favicons ─── -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48x48.png" />

    <!-- ─── Misc ─── -->
    <!-- Prevent iOS from auto-detecting phone numbers as links -->
    <meta name="format-detection" content="telephone=no" />

    <!-- ─── Open Graph (link previews) ─── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Amatyma" />
    <meta property="og:description" content="Connect and chat with your community on Amatyma" />
    <meta property="og:image" content="/icon-512x512.png" />

    <title>Amatyma</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
